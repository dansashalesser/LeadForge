[project]
name = "leadforge"
version = "0.1.0"
description = "Lead ingestion, enrichment, and qualification pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "email-validator>=2.3.0",
    "httpx>=0.28",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "python-dotenv>=1",
    "pyyaml>=6",
    "sqlalchemy>=2",
    "structlog>=24",
    "tenacity>=9",
    # Registrable-domain parsing. Used with suffix_list_urls=() so only the PSL
    # snapshot bundled in the locked release is consulted (no runtime fetch).
    "tldextract>=5",
    "typer>=0.15",
]

[project.scripts]
leadforge = "leadforge.lead_ingestion.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "ruff>=0.8",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "BLE", "PT", "N", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Design mandates these exception names (design.md, Error Strategy).
"src/leadforge/lead_ingestion/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
explicit_package_bases = true
warn_unreachable = true
