# Outreach settings (requirement 14.1): every number the outreach slice uses lives here,
# never in code. Change a value and rerun; no code edit is needed.
#
# sources: the source columns a search is written for. domain_filter takes the people of
# a company by its domains (as {domain_key: [domain, ...]}); phrase_search takes plain
# search phrases (a company that has no entry in company_terms.yaml).
#
# simulation: synthetic runs decide invite acceptance from seed (same seed, same
# acceptances): accept_rate of invites are accepted, within max_accept_days.
#
# qualify.weights: one weight per scoring term. A Lead's score is the weighted mean of
# its term values (each 0..1), so it stays in 0..1 whatever the weights sum to.
# qualify.threshold: the least score a Lead needs to be selected (0..1).
# qualify.customer_stages: CRM lifecycle stages that mark a Lead as already a customer.
#
# triggers: days after an accepted invite before the email fires (accept_delay_days),
# and days an invite may stay unanswered before the fallback email (invite_timeout_days).
#
# messages: character limits, the bound on regenerations before manual review, how many
# hook facts of each kind a writer sees (max_hook_facts), and
# phrases no Message may contain (case-insensitive).
#
# llm: the provider and model used when LEADFORGE_LLM_PROVIDER and LEADFORGE_LLM_MODEL
# are not set (the environment wins, so a different provider needs no edit here); the key
# is read from <PROVIDER>_API_KEY. timeout_s is how long one model call may take,
# compile_retries how many more times a free-text query is compiled when the model's
# plan does not validate, and effort the reasoning effort of the compiler, writer and
# judge (anthropic and openai only; remove it for a provider without one).
#
# outbox_path: the JSONL file every dry-run Message is appended to.

sources:
  domain_filter: apollo
  domain_key: organization_domains
  phrase_search: google_search

simulation:
  seed: 7
  accept_rate: 0.6
  max_accept_days: 4

qualify:
  weights:
    competitor_evidence: 0.35
    icp_fit: 0.25
    intent: 0.15
    contactability: 0.15
    source_agreement: 0.10
  threshold: 0.5
  customer_stages:
    - customer
    - evangelist

triggers:
  accept_delay_days: 2
  invite_timeout_days: 5

messages:
  invite_max_chars: 300
  email_subject_max_chars: 80
  email_max_chars: 1200
  max_regenerations: 3
  max_hook_facts: 3
  max_usage_quote_chars: 160
  banned_phrases:
    - hope this email finds you well
    - touch base
    - circle back
    - synergy
    - game-changer

llm:
  provider: anthropic
  model: claude-sonnet-5-5
  timeout_s: 60
  compile_retries: 2
  effort: low

outbox_path: outbox/dry_run.jsonl
