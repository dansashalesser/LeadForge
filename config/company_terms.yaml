# Company terms (design D2): what a company means as search input.
#
# terms: the Target Profile term keys searched in users mode ("who uses this company's
#   product"). Each must be a term of config/target_profile.yaml.
# domains: the company's domains, searched in workers mode ("who works there"). A domain
#   given on the command line or in the web form is used instead.
#
# A company with no entry is searched by its own name as a plain phrase and the plan is
# flagged unmapped. Lookup ignores case and surrounding or repeated spaces.

companies:
  datastax:
    terms: [datastax, apache_cassandra]
    domains: [datastax.com]
  mongodb:
    terms: [mongodb]
    domains: [mongodb.com]
  couchbase:
    terms: [couchbase]
    domains: [couchbase.com]
