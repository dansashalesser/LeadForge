# Target Profile of the demo dataset: the Apollo technology UIDs its tables are
# keyed by (couchbase has nobody, on purpose) and the Google phrases. Same terms as
# config/target_profile.yaml, kept here so the demo runs from any directory.
technologies:
  apache_cassandra:
    apollo: [cassandra]
    google_search:
      - "Apache Cassandra"
      - "Cassandra database"
  datastax:
    apollo: [datastax]
    google_search:
      - "DataStax"
      - "DataStax Astra"
competitors:
  mongodb:
    apollo: [mongodb_atlas, mongodb_realm]
    google_search:
      - "MongoDB"
      - "MongoDB Atlas"
  couchbase:
    apollo: [couchbase]
    google_search:
      - "Couchbase"
keyword_templates:
  - "{term} migration"
  - "hiring {term} engineer"
  - "{term} alternative"
